name: Release

# Push a tag such as v0.2.0: deploy.sh builds the production plugin, which is
# zipped and attached to a GitHub release with its update.json manifest. Sites
# running the plugin see the update within twelve hours and install it on
# their own.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header="$(sed -n 's/^ \* Version: *//p' cinq-wp-central.php)"
          constant="$(sed -n "s/^const VERSION *= *'\(.*\)';/\1/p" cinq-wp-central.php)"
          if [ "$tag" != "$header" ] || [ "$tag" != "$constant" ]; then
            echo "Tag $tag, header $header, constant $constant: bump both in cinq-wp-central.php." >&2
            exit 1
          fi

      - name: Test
        run: composer install --no-interaction --no-progress && composer test

      # Read before deploy.sh strips the working copy down to the plugin.
      - name: Read the requirements
        id: requires
        run: |
          echo "wp=$(sed -n 's/^ \* Requires at least: *//p' cinq-wp-central.php)" >> "$GITHUB_OUTPUT"
          echo "php=$(sed -n 's/^ \* Requires PHP: *//p' cinq-wp-central.php)" >> "$GITHUB_OUTPUT"

      - name: Build production package
        run: |
          chmod +x deploy.sh
          ./deploy.sh "$RUNNER_TEMP/release.log" || { cat "$RUNNER_TEMP/release.log"; exit 1; }
          cat "$RUNNER_TEMP/release.log"

      # The folder is named after the plugin slug, not the repository:
      # WordPress replaces wp-content/plugins/cinq-wp-central/ with it.
      - name: Create plugin ZIP
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          cp -R . "$RUNNER_TEMP/dist/cinq-wp-central"
          (cd "$RUNNER_TEMP/dist" && zip -qr "$RUNNER_TEMP/cinq-wp-central.zip" cinq-wp-central)
          unzip -l "$RUNNER_TEMP/cinq-wp-central.zip" | tail -n 5

      - name: Write the update manifest
        run: |
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --arg package "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/cinq-wp-central.zip" \
            --arg requires "${{ steps.requires.outputs.wp }}" \
            --arg requires_php "${{ steps.requires.outputs.php }}" \
            '{version: $version, url: $url, package: $package, requires: $requires, requires_php: $requires_php}' > "$RUNNER_TEMP/update.json"
          cat "$RUNNER_TEMP/update.json"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/cinq-wp-central.zip
            ${{ runner.temp }}/update.json
          generate_release_notes: true
